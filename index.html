<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>22-Shruti Pitch Engine — Indian Classical Pitch Recognizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="logo-group">
      <div class="logo-icon">श्रु</div>
      <div>
        <h1>22-Shruti Real-Time Pitch Engine</h1>
        <div class="subtitle">Microtonal Just Intonation for Indian Classical Music</div>
      </div>
    </div>
    <div>
      <span id="statusIndicator" class="status-badge inactive">Mic Inactive</span>
    </div>
  </header>

  <!-- Main Container -->
  <main>

    <!-- Top Controls Bar -->
    <section class="controls-bar">
      <!-- Mic Button -->
      <button id="micBtn" class="btn btn-primary">
        🎤 Turn ON Microphone
      </button>

      <!-- Calibrate Sa -->
      <button id="calibrateBtn" class="btn btn-secondary" title="Sing your Sa steadily for 1.5 seconds to lock your personal tonic">
        🎯 Calibrate Sa
      </button>

      <!-- Tonic / Sa Selection -->
      <div class="control-item">
        <label class="control-label" for="tonicSelect">Tonic (Sa)</label>
        <div style="display: flex; align-items: center; gap: 8px;">
          <select id="tonicSelect">
            <option value="A">A (220.0 Hz)</option>
            <option value="A#">A# / Bb (233.1 Hz)</option>
            <option value="B">B (246.9 Hz)</option>
            <option value="C">C (261.6 Hz)</option>
            <option value="C#" selected>C# (277.2 Hz)</option>
            <option value="D">D (293.7 Hz)</option>
            <option value="D#">D# / Eb (311.1 Hz)</option>
            <option value="E">E (329.6 Hz)</option>
            <option value="F">F (349.2 Hz)</option>
            <option value="F#">F# (370.0 Hz)</option>
            <option value="G">G (392.0 Hz)</option>
            <option value="G#">G# / Ab (415.3 Hz)</option>
          </select>
          <span id="saFreqDisplay" class="freq-pill">277.18 Hz</span>
        </div>
      </div>

      <!-- Raga Selection -->
      <div class="control-item">
        <label class="control-label" for="ragaSelect">Active Raga</label>
        <select id="ragaSelect"></select>
      </div>

      <!-- Tanpura Drone -->
      <div class="control-item">
        <label class="control-label">Acoustic Tanpura</label>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="tanpuraBtn" class="btn btn-secondary">Start Tanpura</button>
          <input type="range" id="tanpuraVol" min="0" max="1" step="0.05" value="0.45" style="width: 70px;" title="Tanpura Volume">
        </div>
      </div>

      <!-- Noise Gate -->
      <div class="control-item">
        <label class="control-label" for="noiseGateSlider">Noise Gate</label>
        <input type="range" id="noiseGateSlider" min="0.002" max="0.04" step="0.002" value="0.008" style="width: 80px;" title="Adjust microphone sensitivity threshold">
      </div>

      <!-- Vocal Smoothing -->
      <div class="control-item">
        <label class="control-label" for="vocalSmoothingSlider">Vocal Smoothing</label>
        <input type="range" id="vocalSmoothingSlider" min="0" max="0.95" step="0.05" value="0.85" style="width: 80px;" title="Adjust jitter smoothing (0 = raw instantaneous, 0.95 = ultra-stable)">
      </div>

      <!-- Adjustment Speed -->
      <div class="control-item">
        <label class="control-label" for="adjustmentSpeedSlider">Adjustment Speed</label>
        <input type="range" id="adjustmentSpeedSlider" min="0.05" max="1.0" step="0.05" value="0.35" style="width: 80px;" title="Reaction speed (Slow = steady average for holding notes, Fast = instant tracking)">
      </div>

      <!-- Resonance Lock Cutoff -->
      <div class="control-item">
        <label class="control-label" for="lockCutoffSlider">Lock Cutoff (<span id="lockCutoffVal" style="color: var(--accent-emerald);">±10¢</span>)</label>
        <input type="range" id="lockCutoffSlider" min="2" max="20" step="1" value="10" style="width: 80px;" title="Cents tolerance for harmonic resonance lock (default ±10¢, adjustable up to ±20¢)">
      </div>

      <!-- Time Span / Scroll Speed -->
      <div class="control-item">
        <label class="control-label" for="timeWindowSlider">Time Span (<span id="timeWindowVal" style="color: var(--accent-gold);">10s</span>)</label>
        <input type="range" id="timeWindowSlider" min="3" max="25" step="1" value="10" style="width: 80px;" title="Seconds visible on screen for observing note holds over time">
      </div>
    </section>

    <!-- LIVE DISPLAY HUD (Slick, Calm Studio Instrument with Analog Arc Tuner) -->
    <section id="hudContainer" class="hud-container idle">
      <!-- Left: Detected Swara & Shruti Name -->
      <div class="hud-swara-box">
        <div id="hudSwaraName" class="hud-swara-main">—</div>
        <div class="hud-sub-group">
          <div id="hudShrutiName" class="hud-shruti-sub">Listening for voice...</div>
          <div id="hudRatio" class="hud-ratio-tag">—</div>
        </div>
      </div>

      <!-- Center: Analog Precision Arc Tuner Dial & Damped Resonance Lock -->
      <div class="hud-meter-box">
        <div class="arc-gauge-container">
          <svg id="arcGaugeSvg" viewBox="0 0 320 170" class="arc-gauge-svg">
            <defs>
              <linearGradient id="arcScaleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
                <stop offset="20%" stop-color="#fbbf24" stop-opacity="0.35"/>
                <stop offset="42%" stop-color="#10b981" stop-opacity="0.7"/>
                <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
                <stop offset="58%" stop-color="#10b981" stop-opacity="0.7"/>
                <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.35"/>
              </linearGradient>
            </defs>

            <!-- Outer Bezel Arc -->
            <path d="M 52.8 74.5 A 128 128 0 0 1 267.2 74.5" class="arc-bezel" />

            <!-- Main Calibrated Scale Track (-50¢ to +50¢) -->
            <path id="arcTrack" d="M 71.9 71.1 A 115 115 0 0 1 248.1 71.1" class="arc-track" />

            <!-- Sweet-Spot Harmonic Lock Zone Arc (-3.5¢ to +3.5¢) -->
            <path id="arcLockZone" d="M 153.0 30.2 A 115 115 0 0 1 167.0 30.2" class="arc-lock-zone" />

            <!-- Arc Tick Marks -->
            <g class="arc-ticks">
              <!-- -50¢ Major --> <line x1="71.9" y1="71.1" x2="64.2" y2="64.7" class="arc-tick major" />
              <!-- -40¢ --> <line x1="86.1" y1="56.9" x2="80.3" y2="50.0" class="arc-tick" />
              <!-- -30¢ --> <line x1="102.5" y1="45.4" x2="98.1" y2="37.5" class="arc-tick" />
              <!-- -25¢ Major --> <line x1="111.4" y1="40.8" x2="106.3" y2="29.9" class="arc-tick major" />
              <!-- -20¢ --> <line x1="120.7" y1="37.0" x2="118.4" y2="28.5" class="arc-tick" />
              <!-- -10¢ --> <line x1="140.0" y1="31.8" x2="138.8" y2="23.1" class="arc-tick" />
              <!-- 0¢ Pure Center (Longest, Emerald) -->
              <line x1="160" y1="30" x2="160" y2="13" class="arc-tick pure" />
              <!-- +10¢ --> <line x1="180.0" y1="31.8" x2="181.2" y2="23.1" class="arc-tick" />
              <!-- +20¢ --> <line x1="199.3" y1="37.0" x2="201.6" y2="28.5" class="arc-tick" />
              <!-- +25¢ Major --> <line x1="208.6" y1="40.8" x2="213.7" y2="29.9" class="arc-tick major" />
              <!-- +30¢ --> <line x1="217.5" y1="45.4" x2="221.9" y2="37.5" class="arc-tick" />
              <!-- +40¢ --> <line x1="233.9" y1="56.9" x2="239.7" y2="50.0" class="arc-tick" />
              <!-- +50¢ Major --> <line x1="248.1" y1="71.1" x2="255.8" y2="64.7" class="arc-tick major" />
            </g>

            <!-- Degree Labels -->
            <text x="50" y="80" class="arc-label">-50¢</text>
            <text x="100" y="27" class="arc-label">-25¢</text>
            <text x="160" y="10" class="arc-label pure">0¢ PURE</text>
            <text x="220" y="27" class="arc-label">+25¢</text>
            <text x="270" y="80" class="arc-label">+50¢</text>
            <text x="75" y="100" class="arc-sub-label">FLAT ♭</text>
            <text x="245" y="100" class="arc-sub-label">♯ SHARP</text>

            <!-- Dynamic Analog Needle -->
            <g id="arcNeedleGroup" style="transform-origin: 160px 145px; transform: rotate(0deg);">
              <line x1="160" y1="145" x2="160" y2="25" id="arcNeedleLine" class="arc-needle-line" />
              <polygon points="158,28 162,28 160,18" id="arcNeedleHead" class="arc-needle-head" />
            </g>

            <!-- Center Pivot Hub -->
            <circle cx="160" cy="145" r="14" class="arc-pivot-base" />
            <circle cx="160" cy="145" r="7" class="arc-pivot-cap" />
          </svg>

          <!-- Digital Readout nestled inside the arc dial -->
          <div class="arc-digital-hub">
            <div id="hudDeviation" class="hud-deviation">—</div>
            <span id="hudLockTag" class="hud-lock-tag">RESONANCE LOCK</span>
          </div>
        </div>
      </div>

      <!-- Right: Frequency Telemetry -->
      <div class="hud-telemetry-box">
        <div class="telemetry-label">FREQUENCY</div>
        <div id="hudFreq" class="hud-freq">— Hz</div>
        <div id="hudTargetCents" class="hud-target-info">Target: —</div>
      </div>
    </section>

    <!-- 60 FPS Scrolling Pitch Canvas -->
    <section class="canvas-wrapper">
      <canvas id="pitchCanvas"></canvas>
    </section>

    <!-- Bottom Raga Info Strip -->
    <footer class="raga-info-strip">
      <div>
        <strong>Prahar:</strong> <span id="ragaPrahar">—</span> | 
        <span id="ragaVadi">—</span>
      </div>
      <div>
        <span id="ragaDesc">—</span>
      </div>
    </footer>

  </main>

  <!-- Application Scripts -->
  <script src="data/shrutis.js"></script>
  <script src="data/ragas.js"></script>
  <script src="js/dsp.js"></script>
  <script src="js/tanpura.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
